<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liquid Glass Fake Chat Generator</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
      :root {
        --bg0: #06080d;
        --bg1: #0a1018;
        --bg2: #0f1622;
        --text: #f5f8ff;
        --muted: rgba(235, 241, 255, 0.66);
        --line: rgba(255, 255, 255, 0.12);
        --line2: rgba(255, 255, 255, 0.08);
        --glass: rgba(255, 255, 255, 0.08);
        --glass2: rgba(255, 255, 255, 0.12);
        --blue: #8bc9ff;
        --green: #8ef0c8;
        --danger: #ff8da0;
        --radius-xl: 30px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(
            circle at top,
            rgba(139, 201, 255, 0.16),
            transparent 24%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(142, 240, 200, 0.1),
            transparent 18%
          ),
          linear-gradient(180deg, #0a0f16 0%, #06080d 100%);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
      }

      .app {
        width: 100%;
        max-width: 460px;
        min-height: 100vh;
        padding: 12px 12px env(safe-area-inset-bottom, 0);
        position: relative;
      }

      .glass {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.06)
        );
        backdrop-filter: blur(18px) saturate(1.15);
        -webkit-backdrop-filter: blur(18px) saturate(1.15);
        border: 1px solid var(--line);
        box-shadow:
          var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .glass-soft {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.04)
        );
        backdrop-filter: blur(14px) saturate(1.08);
        -webkit-backdrop-filter: blur(14px) saturate(1.08);
        border: 1px solid var(--line2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 2px 10px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .brand-sub {
        font-size: 11px;
        color: var(--muted);
      }

      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .btn,
      .icon-btn,
      .chip-btn,
      .composer-icon,
      .fab {
        border: 0;
        color: var(--text);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .chip-btn {
        height: 40px;
        border-radius: 999px;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 700;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .phone {
        position: relative;
        min-height: calc(100vh - 74px);
      }

      .header {
        position: sticky;
        top: 8px;
        z-index: 12;
        border-radius: 30px;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .header-main {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        background: transparent;
        border: 0;
        color: inherit;
        padding: 0;
        text-align: left;
        cursor: pointer;
      }

      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
        font-size: 14px;
        font-weight: 800;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .header-title {
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .header-sub {
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .header-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      .capture {
        border-radius: 32px;
        overflow: hidden;
        position: relative;
        min-height: calc(100vh - 180px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: var(--shadow);
        background: #08101a;
      }

      .wallpaper {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.05),
            transparent 26%
          ),
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent),
          linear-gradient(180deg, #0b1018 0%, #09111b 100%);
        background-size: cover;
        background-position: center;
        filter: saturate(1.02);
      }

      .overlay-noise {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent),
          radial-gradient(
            circle at top,
            rgba(139, 201, 255, 0.06),
            transparent 28%
          );
        pointer-events: none;
      }

      .conversation {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 260px);
        padding: 14px 12px 110px;
        display: flex;
        flex-direction: column;
      }

      .date-wrap,
      .system-wrap {
        display: flex;
        justify-content: center;
        padding: 8px 0;
      }

      .date-pill,
      .system-card {
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .system-card {
        border-radius: 16px;
        max-width: 82%;
        text-align: center;
        line-height: 1.4;
      }

      .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 4px 0;
      }

      .row.incoming {
        justify-content: flex-start;
      }

      .row.outgoing {
        justify-content: flex-end;
      }

      .member-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 10px;
        font-weight: 800;
        flex-shrink: 0;
        margin-bottom: 5px;
      }

      .member-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .bubble-wrap {
        max-width: 82%;
        min-width: 78px;
      }

      .sender-name {
        font-size: 11px;
        font-weight: 700;
        margin: 0 0 4px 10px;
      }

      .bubble {
        position: relative;
        border-radius: 24px;
        padding: 11px 13px 9px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
        cursor: pointer;
        transition:
          transform 0.14s ease,
          border-color 0.14s ease,
          box-shadow 0.14s ease;
      }

      .bubble:hover {
        transform: translateY(-1px);
      }

      .bubble.selected {
        border-color: rgba(139, 201, 255, 0.45);
        box-shadow:
          0 0 0 1px rgba(139, 201, 255, 0.18),
          0 16px 32px rgba(0, 0, 0, 0.24);
      }

      .bubble::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.1),
          transparent 46%
        );
        pointer-events: none;
      }

      .bubble.incoming {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.14),
          rgba(255, 255, 255, 0.08)
        );
      }

      .bubble.outgoing {
        background: linear-gradient(
          180deg,
          rgba(30, 77, 62, 0.96),
          rgba(15, 42, 34, 0.96)
        );
      }

      .bubble-text {
        position: relative;
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble-meta {
        position: relative;
        margin-top: 5px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.64);
      }

      .status-read {
        color: var(--blue);
      }

      .media-box {
        height: 150px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.45);
        font-size: 34px;
      }

      .voice-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .voice-play {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        flex-shrink: 0;
        font-size: 14px;
      }

      .wave {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 2px;
        min-height: 24px;
      }

      .wave span {
        width: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.74);
        display: block;
      }

      .typing {
        display: inline-flex;
        gap: 5px;
        padding: 5px 2px;
      }

      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.74);
        animation: blink 1.1s infinite ease-in-out;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      .inline-toolbar {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        z-index: 30;
        display: none;
        gap: 8px;
        padding: 8px;
        border-radius: 999px;
      }

      .inline-toolbar.show {
        display: flex;
      }

      .small-chip {
        border: 0;
        height: 36px;
        border-radius: 999px;
        padding: 0 12px;
        font-size: 11px;
        font-weight: 700;
        color: white;
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.42);
        z-index: 40;
        display: none;
      }

      .backdrop.show {
        display: block;
      }

      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 41;
        border-radius: 30px 30px 0 0;
        padding: 12px 14px calc(18px + env(safe-area-inset-bottom, 0));
        transform: translateY(105%);
        transition: transform 0.24s ease;
        max-height: 80vh;
        overflow: auto;
      }

      .sheet.show {
        transform: translateY(0);
      }

      .sheet-handle {
        width: 54px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        margin: 0 auto 14px;
      }

      .sheet-title {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .field {
        margin-bottom: 12px;
      }

      .label {
        display: block;
        margin-bottom: 7px;
        font-size: 12px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.92);
      }

      .input,
      .textarea,
      .select {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        border-radius: 18px;
        padding: 12px 14px;
        outline: none;
        font: inherit;
      }

      .textarea {
        min-height: 96px;
        resize: vertical;
      }

      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .seg-btn {
        height: 44px;
        border-radius: 16px;
        border: 0;
        color: white;
        background: rgba(255, 255, 255, 0.08);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .seg-btn.active {
        background: rgba(255, 255, 255, 0.16);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        font-size: 12px;
        cursor: pointer;
      }

      .chip.active {
        background: rgba(255, 255, 255, 0.16);
      }

      .actions-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .sheet-btn {
        height: 46px;
        border-radius: 18px;
        border: 0;
        background: rgba(255, 255, 255, 0.08);
        color: white;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }

      .sheet-btn.danger {
        background: rgba(255, 90, 110, 0.16);
        color: #ffd5dc;
      }

      .members-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .member-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .member-card input {
        flex: 1;
        background: transparent;
        border: 0;
        color: white;
        outline: none;
        font: inherit;
      }

      .member-card .avatar {
        width: 40px;
        height: 40px;
        font-size: 12px;
      }

      .file-input {
        width: 100%;
        color: var(--muted);
        font-size: 12px;
      }

      .hidden {
        display: none !important;
      }

      .composer-bar {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 6;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        background: transparent;
        border: 0;
        padding: 0;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .liquid-pill {
        flex: 1;
        min-height: 56px;
        border-radius: 999px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 10px 12px;
        position: relative;
        overflow: hidden;
      }

      .liquid-pill::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.16),
            rgba(255, 255, 255, 0.06)
          ),
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.08),
            transparent 30%
          );
        pointer-events: none;
      }

      .liquid-pill {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px) saturate(1.1);
        -webkit-backdrop-filter: blur(20px) saturate(1.1);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.26),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .liquid-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(18px) saturate(1.08);
        -webkit-backdrop-filter: blur(18px) saturate(1.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 16px 36px rgba(0, 0, 0, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
      }

      #voiceBtn {
        background: linear-gradient(
          135deg,
          rgba(50, 130, 255, 0.85),
          rgba(135, 235, 200, 0.55)
        );
      }

      .composer-icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: rgba(255, 255, 255, 0.08);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 18px;
        cursor: pointer;
      }

      .composer-real-input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: none;
        resize: none;
        color: white;
        font: inherit;
        line-height: 1.45;
        font-size: 15px;
        max-height: 110px;
        padding: 6px 0 4px;
      }

      .composer-real-input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      @media (max-width: 390px) {
        .app {
          padding-left: 8px;
          padding-right: 8px;
        }

        .bubble-wrap {
          max-width: 86%;
        }

        .liquid-btn {
          width: 52px;
          height: 52px;
          font-size: 22px;
        }

        .liquid-pill {
          min-height: 52px;
          padding: 9px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <div class="brand-title">Fake Chat Generator</div>
          <div class="brand-sub">Liquid glass mobile editor</div>
        </div>
        <div class="top-actions">
          <button class="chip-btn glass-soft" id="newChatBtn">New Chat</button>
          <button class="icon-btn glass-soft" id="exportBtn">⤓</button>
        </div>
      </div>

      <div class="phone">
        <div class="header glass">
          <button class="header-main" id="openSettingsBtn">
            <div class="avatar" id="headerAvatar">SC</div>
            <div style="min-width: 0">
              <div class="header-title" id="headerTitle">
                Studio Concept Team
              </div>
              <div class="header-sub" id="headerSubtitle">
                Ali, Budi, Rara +2
              </div>
            </div>
          </button>
          <div class="header-actions">
            <button class="icon-btn glass-soft" id="openMembersBtn">👥</button>
            <button class="icon-btn glass-soft">📞</button>
            <button class="icon-btn glass-soft">🎥</button>
          </div>
        </div>

        <div class="capture" id="captureArea">
          <div class="wallpaper" id="wallpaper"></div>
          <div class="overlay-noise"></div>

          <div class="conversation" id="conversation"></div>

          <div class="composer-bar" id="composerBar">
            <button class="composer-side-btn liquid-btn" id="plusBtn">
              ＋
            </button>

            <div class="composer-pill liquid-pill">
              <button class="composer-icon-btn" id="emojiBtn">☺</button>
              <textarea
                class="composer-real-input"
                id="composerInput"
                rows="1"
                placeholder="Type a message"
              ></textarea>
              <button class="composer-icon-btn hidden" id="cameraBtn">
                📷
              </button>
            </div>

            <button class="composer-side-btn liquid-btn" id="voiceBtn">
              🎤
            </button>

            <div class="hidden">
              <select id="directionSelect">
                <option value="outgoing">My message</option>
                <option value="incoming">Other message</option>
              </select>

              <select id="senderSelect"></select>

              <select id="typeSelect">
                <option value="text">Text</option>
                <option value="image">Image</option>
                <option value="voice">Voice</option>
                <option value="typing">Typing</option>
                <option value="date">Date</option>
                <option value="system">System</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="inline-toolbar glass" id="inlineToolbar">
      <button class="small-chip" id="toolbarEdit">Edit</button>
      <button class="small-chip" id="toolbarDuplicate">Duplicate</button>
      <button class="small-chip" id="toolbarDelete">Delete</button>
      <button class="small-chip" id="toolbarMove">Move</button>
    </div>

    <div class="backdrop" id="backdrop"></div>

    <div class="sheet glass" id="messageSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Edit message</div>

      <div class="field">
        <label class="label">Text / caption</label>
        <textarea class="textarea" id="msgText"></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label class="label">Time</label>
          <input class="input" id="msgTime" placeholder="09:24" />
        </div>
        <div class="field">
          <label class="label">Status</label>
          <select class="select" id="msgStatus">
            <option value="sending">sending</option>
            <option value="sent">sent</option>
            <option value="delivered">delivered</option>
            <option value="read">read</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label">Direction</label>
        <div class="seg">
          <button class="seg-btn" id="dirIncomingBtn">Incoming</button>
          <button class="seg-btn" id="dirOutgoingBtn">Outgoing</button>
        </div>
      </div>

      <div class="field">
        <label class="label">Message type</label>
        <div class="chips" id="typeChips"></div>
      </div>

      <div class="field" id="senderField">
        <label class="label">Sender</label>
        <div class="chips" id="senderChips"></div>
      </div>

      <div class="actions-grid">
        <button class="sheet-btn" id="moveUpBtn">Move up</button>
        <button class="sheet-btn" id="moveDownBtn">Move down</button>
        <button class="sheet-btn" id="duplicateBtn">Duplicate</button>
        <button class="sheet-btn danger" id="deleteBtn">Delete</button>
      </div>
    </div>

    <div class="sheet glass" id="settingsSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Chat settings</div>

      <div class="field">
        <label class="label">Chat type</label>
        <div class="seg">
          <button class="seg-btn" id="privateBtn">Private</button>
          <button class="seg-btn" id="groupBtn">Group</button>
        </div>
      </div>

      <div class="field">
        <label class="label">Title</label>
        <input class="input" id="chatTitleInput" />
      </div>

      <div class="field">
        <label class="label">Subtitle / status</label>
        <input class="input" id="chatSubtitleInput" />
      </div>

      <div class="field">
        <label class="label">Header profile photo</label>
        <input
          class="file-input"
          type="file"
          accept="image/*"
          id="avatarUpload"
        />
      </div>

      <div class="field">
        <label class="label">Chat background / wallpaper</label>
        <input class="file-input" type="file" accept="image/*" id="bgUpload" />
      </div>

      <div class="actions-grid">
        <button class="sheet-btn" id="removeAvatarBtn">Remove avatar</button>
        <button class="sheet-btn" id="removeBgBtn">Remove wallpaper</button>
        <button class="sheet-btn" id="settingsCloseBtn">Close</button>
        <button class="sheet-btn" id="settingsSaveBtn">Save</button>
      </div>
    </div>

    <div class="sheet glass" id="membersSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Group members</div>
      <div class="members-list" id="membersList"></div>
      <div class="actions-grid">
        <button class="sheet-btn" id="addMemberBtn">Add member</button>
        <button class="sheet-btn" id="membersCloseBtn">Close</button>
      </div>
    </div>

    <script>
      const state = {
        conversation: {
          id: "conv-1",
          type: "group",
          title: "Studio Concept Team",
          subtitle: "Ali, Budi, Rara +2",
          avatarUrl: "",
          backgroundUrl: "",
          members: [
            { id: "self", name: "You", color: "#8ef0c8", avatarUrl: "" },
            { id: "m1", name: "Ali", color: "#8bc9ff", avatarUrl: "" },
            { id: "m2", name: "Budi", color: "#f6b6ff", avatarUrl: "" },
            { id: "m3", name: "Rara", color: "#ffd67d", avatarUrl: "" },
          ],
          messages: [
            { id: "msg1", type: "date", text: "Today" },
            {
              id: "msg2",
              type: "text",
              direction: "incoming",
              memberId: "m1",
              text: "Halo semua, review UI jadi jam 10 ya.",
              time: "09:12",
              status: "sent",
            },
            {
              id: "msg3",
              type: "text",
              direction: "incoming",
              memberId: "m2",
              text: "Siap. Aku bawa revisi bubble dan composer bar.",
              time: "09:13",
              status: "sent",
            },
            {
              id: "msg4",
              type: "text",
              direction: "outgoing",
              memberId: "self",
              text: "Oke, sekalian finalin export dan group flow.",
              time: "09:14",
              status: "read",
            },
            {
              id: "msg5",
              type: "image",
              direction: "incoming",
              memberId: "m3",
              text: "Preview concept image",
              time: "09:17",
              status: "sent",
            },
            {
              id: "msg6",
              type: "voice",
              direction: "outgoing",
              memberId: "self",
              text: "0:12",
              time: "09:18",
              status: "delivered",
            },
            {
              id: "msg7",
              type: "typing",
              direction: "incoming",
              memberId: "m1",
              text: "",
              time: "",
              status: "sent",
            },
          ],
        },
        selectedMessageId: null,
        activeSheet: null,
      };

      const conversationEl = document.getElementById("conversation");
      const headerTitleEl = document.getElementById("headerTitle");
      const headerSubtitleEl = document.getElementById("headerSubtitle");
      const headerAvatarEl = document.getElementById("headerAvatar");
      const wallpaperEl = document.getElementById("wallpaper");
      const inlineToolbar = document.getElementById("inlineToolbar");
      const backdrop = document.getElementById("backdrop");
      const messageSheet = document.getElementById("messageSheet");
      const settingsSheet = document.getElementById("settingsSheet");
      const membersSheet = document.getElementById("membersSheet");

      const directionSelect = document.getElementById("directionSelect");
      const senderSelect = document.getElementById("senderSelect");
      const typeSelect = document.getElementById("typeSelect");
      const composerInput = document.getElementById("composerInput");

      const msgText = document.getElementById("msgText");
      const msgTime = document.getElementById("msgTime");
      const msgStatus = document.getElementById("msgStatus");
      const dirIncomingBtn = document.getElementById("dirIncomingBtn");
      const dirOutgoingBtn = document.getElementById("dirOutgoingBtn");
      const typeChips = document.getElementById("typeChips");
      const senderChips = document.getElementById("senderChips");
      const senderField = document.getElementById("senderField");

      const chatTitleInput = document.getElementById("chatTitleInput");
      const chatSubtitleInput = document.getElementById("chatSubtitleInput");
      const membersList = document.getElementById("membersList");

      const messageTypes = [
        "text",
        "image",
        "voice",
        "typing",
        "date",
        "system",
      ];

      function uid(prefix = "id") {
        return prefix + "-" + Math.random().toString(36).slice(2, 9);
      }

      function initials(text) {
        return (text || "?")
          .split(" ")
          .map((v) => v[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      }

      function getMember(id) {
        return state.conversation.members.find((m) => m.id === id);
      }

      function getSelectedMessage() {
        return (
          state.conversation.messages.find(
            (m) => m.id === state.selectedMessageId,
          ) || null
        );
      }

      function setAvatarBox(el, url, fallbackText) {
        el.innerHTML = "";
        if (url) {
          const img = document.createElement("img");
          img.src = url;
          el.appendChild(img);
        } else {
          el.textContent = fallbackText;
        }
      }

      function formatStatus(status) {
        if (status === "read") return "✓✓";
        if (status === "delivered") return "✓✓";
        if (status === "sent") return "✓";
        return "◔";
      }

      function createWave() {
        const wave = document.createElement("div");
        wave.className = "wave";
        [10, 15, 18, 11, 8, 13, 17, 14, 9, 16, 11, 18, 10, 13, 15].forEach(
          (h) => {
            const s = document.createElement("span");
            s.style.height = h + "px";
            wave.appendChild(s);
          },
        );
        return wave;
      }

      function rebuildGroupSubtitle() {
        if (state.conversation.type !== "group") return;
        const names = state.conversation.members
          .filter((m) => m.id !== "self")
          .map((m) => m.name);
        state.conversation.subtitle =
          names.length > 3
            ? `${names[0]}, ${names[1]}, ${names[2]} +${names.length - 3}`
            : names.join(", ");
      }

      function renderHeader() {
        headerTitleEl.textContent = state.conversation.title;
        headerSubtitleEl.textContent = state.conversation.subtitle;

        setAvatarBox(
          headerAvatarEl,
          state.conversation.avatarUrl,
          initials(state.conversation.title),
        );

        if (state.conversation.backgroundUrl) {
          wallpaperEl.style.background = `
            linear-gradient(180deg, rgba(7,10,15,.22), rgba(7,10,15,.46)),
            url(${state.conversation.backgroundUrl}) center center / cover no-repeat
          `;
        } else {
          wallpaperEl.style.background = `
            radial-gradient(circle at top, rgba(255,255,255,.05), transparent 26%),
            linear-gradient(180deg, rgba(255,255,255,.02), transparent),
            linear-gradient(180deg, #0b1018 0%, #09111b 100%)
          `;
        }

        document
          .getElementById("openMembersBtn")
          .classList.toggle("hidden", state.conversation.type !== "group");
      }

      function updateComposerModeHint() {
        const isOutgoing = directionSelect.value === "outgoing";
        let senderLabel = "You";

        if (!isOutgoing) {
          const selectedOption =
            senderSelect.options[senderSelect.selectedIndex];
          senderLabel = selectedOption ? selectedOption.textContent : "Other";
        }

        composerInput.placeholder = isOutgoing
          ? "Type a message"
          : `Type a message as ${senderLabel}`;
      }

      function renderComposerSenderOptions() {
        senderSelect.innerHTML = "";

        if (directionSelect.value === "outgoing") {
          const opt = document.createElement("option");
          opt.value = "self";
          opt.textContent = "You";
          senderSelect.appendChild(opt);
          senderSelect.disabled = true;
          updateComposerModeHint();
          return;
        }

        senderSelect.disabled = false;

        if (state.conversation.type === "group") {
          state.conversation.members
            .filter((m) => m.id !== "self")
            .forEach((member) => {
              const opt = document.createElement("option");
              opt.value = member.id;
              opt.textContent = member.name;
              senderSelect.appendChild(opt);
            });
        } else {
          const otherMember = state.conversation.members.find(
            (m) => m.id !== "self",
          );
          const opt = document.createElement("option");
          opt.value = otherMember?.id || "other";
          opt.textContent = otherMember?.name || "Other";
          senderSelect.appendChild(opt);
        }

        updateComposerModeHint();
      }

      function renderConversation() {
        conversationEl.innerHTML = "";

        state.conversation.messages.forEach((msg) => {
          if (msg.type === "date") {
            const wrap = document.createElement("div");
            wrap.className = "date-wrap";
            const pill = document.createElement("div");
            pill.className = "date-pill";
            pill.textContent = msg.text || "Today";
            pill.onclick = () => selectMessage(msg.id);
            wrap.appendChild(pill);
            conversationEl.appendChild(wrap);
            return;
          }

          if (msg.type === "system") {
            const wrap = document.createElement("div");
            wrap.className = "system-wrap";
            const card = document.createElement("div");
            card.className = "system-card";
            card.textContent = msg.text || "Messages are end-to-end encrypted.";
            card.onclick = () => selectMessage(msg.id);
            wrap.appendChild(card);
            conversationEl.appendChild(wrap);
            return;
          }

          const row = document.createElement("div");
          row.className =
            "row " + (msg.direction === "outgoing" ? "outgoing" : "incoming");

          const member = getMember(msg.memberId);
          const isGroupIncoming =
            state.conversation.type === "group" && msg.direction === "incoming";

          if (isGroupIncoming) {
            const av = document.createElement("div");
            av.className = "member-avatar";
            if (member?.avatarUrl) {
              const img = document.createElement("img");
              img.src = member.avatarUrl;
              av.appendChild(img);
            } else {
              av.textContent = initials(member?.name || "?");
            }
            row.appendChild(av);
          }

          const wrap = document.createElement("div");
          wrap.className = "bubble-wrap";

          if (isGroupIncoming && member) {
            const sender = document.createElement("div");
            sender.className = "sender-name";
            sender.style.color = member.color || "#8bc9ff";
            sender.textContent = member.name;
            wrap.appendChild(sender);
          }

          const bubble = document.createElement("div");
          bubble.className =
            "bubble " +
            (msg.direction === "outgoing" ? "outgoing" : "incoming");
          if (state.selectedMessageId === msg.id)
            bubble.classList.add("selected");
          bubble.onclick = () => selectMessage(msg.id);

          if (msg.type === "text") {
            const text = document.createElement("div");
            text.className = "bubble-text";
            text.textContent = msg.text || "New message";
            bubble.appendChild(text);
          }

          if (msg.type === "image") {
            const media = document.createElement("div");
            media.className = "media-box";
            media.textContent = "🖼";
            bubble.appendChild(media);

            const cap = document.createElement("div");
            cap.className = "bubble-text";
            cap.textContent = msg.text || "Image caption";
            bubble.appendChild(cap);
          }

          if (msg.type === "voice") {
            const voice = document.createElement("div");
            voice.className = "voice-row";

            const play = document.createElement("div");
            play.className = "voice-play";
            play.textContent = "▶";
            voice.appendChild(play);
            voice.appendChild(createWave());
            bubble.appendChild(voice);

            const meta = document.createElement("div");
            meta.className = "bubble-meta";
            meta.style.justifyContent = "space-between";
            meta.innerHTML = `<span style="opacity:.72">🎤 ${msg.text || "0:08"}</span><span>${msg.time || ""}</span>`;
            bubble.appendChild(meta);

            wrap.appendChild(bubble);
            row.appendChild(wrap);
            conversationEl.appendChild(row);
            return;
          }

          if (msg.type === "typing") {
            const typing = document.createElement("div");
            typing.className = "typing";
            typing.innerHTML = "<span></span><span></span><span></span>";
            bubble.appendChild(typing);
            wrap.appendChild(bubble);
            row.appendChild(wrap);
            conversationEl.appendChild(row);
            return;
          }

          if (msg.type === "text" || msg.type === "image") {
            const meta = document.createElement("div");
            meta.className = "bubble-meta";
            meta.innerHTML = `
              <span>${msg.time || ""}</span>
              ${msg.direction === "outgoing" ? `<span class="${msg.status === "read" ? "status-read" : ""}">${formatStatus(msg.status || "sent")}</span>` : ""}
            `;
            bubble.appendChild(meta);
          }

          wrap.appendChild(bubble);
          row.appendChild(wrap);
          conversationEl.appendChild(row);
        });
      }

      function renderMessageSheet() {
        const msg = getSelectedMessage();
        if (!msg) return;

        msgText.value = msg.text || "";
        msgTime.value = msg.time || "";
        msgStatus.value = msg.status || "sent";

        dirIncomingBtn.classList.toggle("active", msg.direction !== "outgoing");
        dirOutgoingBtn.classList.toggle("active", msg.direction === "outgoing");

        typeChips.innerHTML = "";
        messageTypes.forEach((type) => {
          const btn = document.createElement("button");
          btn.className = "chip" + (msg.type === type ? " active" : "");
          btn.textContent = type;
          btn.onclick = () => {
            msg.type = type;
            if (type === "date" && !msg.text) msg.text = "Today";
            if (type === "system" && !msg.text)
              msg.text = "Messages are end-to-end encrypted.";
            if (type === "voice" && !msg.text) msg.text = "0:08";
            renderMessageSheet();
            renderConversation();
          };
          typeChips.appendChild(btn);
        });

        const showSender =
          state.conversation.type === "group" && msg.direction !== "outgoing";
        senderField.classList.toggle("hidden", !showSender);
        senderChips.innerHTML = "";

        if (showSender) {
          state.conversation.members
            .filter((m) => m.id !== "self")
            .forEach((member) => {
              const btn = document.createElement("button");
              btn.className =
                "chip" + (msg.memberId === member.id ? " active" : "");
              btn.textContent = member.name;
              btn.onclick = () => {
                msg.memberId = member.id;
                renderMessageSheet();
                renderConversation();
              };
              senderChips.appendChild(btn);
            });
        }
      }

      function renderSettingsSheet() {
        chatTitleInput.value = state.conversation.title;
        chatSubtitleInput.value = state.conversation.subtitle;
        document
          .getElementById("privateBtn")
          .classList.toggle("active", state.conversation.type === "private");
        document
          .getElementById("groupBtn")
          .classList.toggle("active", state.conversation.type === "group");
      }

      function renderMembersSheet() {
        membersList.innerHTML = "";

        state.conversation.members.forEach((member) => {
          const card = document.createElement("div");
          card.className = "member-card";

          const av = document.createElement("div");
          av.className = "avatar";
          setAvatarBox(av, member.avatarUrl, initials(member.name));

          const input = document.createElement("input");
          input.value = member.name;
          input.oninput = (e) => {
            member.name = e.target.value || "Member";
            rebuildGroupSubtitle();
            renderAll();
            openSheet("members");
          };

          const colorDot = document.createElement("div");
          colorDot.style.width = "10px";
          colorDot.style.height = "10px";
          colorDot.style.borderRadius = "50%";
          colorDot.style.background = member.color || "#8bc9ff";
          colorDot.style.flexShrink = "0";

          const upload = document.createElement("input");
          upload.type = "file";
          upload.accept = "image/*";
          upload.className = "file-input";
          upload.style.maxWidth = "92px";
          upload.onchange = (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            fileToDataUrl(file, (data) => {
              member.avatarUrl = data;
              renderAll();
              openSheet("members");
            });
          };

          const del = document.createElement("button");
          del.className =
            member.id === "self" ? "sheet-btn" : "sheet-btn danger";
          del.style.width = "70px";
          del.style.height = "40px";
          del.textContent = member.id === "self" ? "Locked" : "Delete";

          if (member.id !== "self") {
            del.onclick = () => {
              state.conversation.members = state.conversation.members.filter(
                (m) => m.id !== member.id,
              );
              state.conversation.messages.forEach((msg) => {
                if (msg.memberId === member.id) {
                  msg.memberId =
                    state.conversation.members.find((m) => m.id !== "self")
                      ?.id || "self";
                }
              });
              rebuildGroupSubtitle();
              renderAll();
              openSheet("members");
            };
          } else {
            del.disabled = true;
          }

          const right = document.createElement("div");
          right.style.display = "flex";
          right.style.flexDirection = "column";
          right.style.gap = "6px";
          right.style.flex = "1";
          right.appendChild(input);
          right.appendChild(upload);

          card.appendChild(av);
          card.appendChild(right);
          card.appendChild(colorDot);
          card.appendChild(del);
          membersList.appendChild(card);
        });
      }

      function renderAll() {
        renderHeader();
        renderComposerSenderOptions();
        renderConversation();
        if (state.activeSheet === "message") renderMessageSheet();
        if (state.activeSheet === "settings") renderSettingsSheet();
        if (state.activeSheet === "members") renderMembersSheet();
      }

      function cycleComposerSender() {
        if (directionSelect.value === "outgoing") {
          directionSelect.value = "incoming";
          renderComposerSenderOptions();
          senderSelect.selectedIndex = 0;
        } else {
          if (
            senderSelect.options.length > 1 &&
            senderSelect.selectedIndex < senderSelect.options.length - 1
          ) {
            senderSelect.selectedIndex += 1;
          } else {
            directionSelect.value = "outgoing";
            renderComposerSenderOptions();
          }
        }

        updateComposerModeHint();
      }

      function openSheet(name) {
        state.activeSheet = name;
        backdrop.classList.add("show");
        [messageSheet, settingsSheet, membersSheet].forEach((el) =>
          el.classList.remove("show"),
        );

        if (name === "message") {
          renderMessageSheet();
          messageSheet.classList.add("show");
        }
        if (name === "settings") {
          renderSettingsSheet();
          settingsSheet.classList.add("show");
        }
        if (name === "members") {
          renderMembersSheet();
          membersSheet.classList.add("show");
        }
      }

      function closeSheets() {
        state.activeSheet = null;
        backdrop.classList.remove("show");
        [messageSheet, settingsSheet, membersSheet].forEach((el) =>
          el.classList.remove("show"),
        );
      }

      function clearSelection() {
        state.selectedMessageId = null;
        inlineToolbar.classList.remove("show");
        renderConversation();
      }

      function selectMessage(id) {
        state.selectedMessageId = id;
        renderConversation();
        inlineToolbar.classList.add("show");
      }

      function addComposerMessage() {
        const direction = directionSelect.value;
        const type = typeSelect.value;
        const senderId = direction === "outgoing" ? "self" : senderSelect.value;
        const text = composerInput.value.trim();
        const time = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        const msg = {
          id: uid("msg"),
          type,
          direction,
          memberId: senderId,
          text:
            type === "date"
              ? text || "Today"
              : type === "system"
                ? text || "Messages are end-to-end encrypted."
                : type === "voice"
                  ? text || "0:08"
                  : text,
          time: ["date", "system", "typing"].includes(type) ? "" : time,
          status: direction === "outgoing" ? "sent" : "sent",
        };

        state.conversation.messages.push(msg);
        composerInput.value = "";
        composerInput.style.height = "auto";
        state.selectedMessageId = msg.id;
        renderAll();
        openSheet("message");
      }

      function deleteSelected() {
        if (!state.selectedMessageId) return;
        state.conversation.messages = state.conversation.messages.filter(
          (m) => m.id !== state.selectedMessageId,
        );
        clearSelection();
        closeSheets();
        renderAll();
      }

      function duplicateSelected() {
        const msg = getSelectedMessage();
        if (!msg) return;
        const copy = JSON.parse(JSON.stringify(msg));
        copy.id = uid("msg");
        const i = state.conversation.messages.findIndex((m) => m.id === msg.id);
        state.conversation.messages.splice(i + 1, 0, copy);
        state.selectedMessageId = copy.id;
        renderAll();
        openSheet("message");
      }

      function moveSelected(dir) {
        if (!state.selectedMessageId) return;
        const arr = state.conversation.messages;
        const i = arr.findIndex((m) => m.id === state.selectedMessageId);
        if (i < 0) return;
        const t = dir === "up" ? i - 1 : i + 1;
        if (t < 0 || t >= arr.length) return;
        const [item] = arr.splice(i, 1);
        arr.splice(t, 0, item);
        renderAll();
      }

      function fileToDataUrl(file, cb) {
        const reader = new FileReader();
        reader.onload = (e) => cb(e.target.result);
        reader.readAsDataURL(file);
      }

      document.getElementById("newChatBtn").onclick = () => {
        const isGroup = confirm("OK = Group chat\nCancel = Private chat");
        state.conversation = {
          id: uid("conv"),
          type: isGroup ? "group" : "private",
          title: isGroup ? "New Group" : "New Chat",
          subtitle: isGroup ? "Ali, Budi +1" : "online",
          avatarUrl: "",
          backgroundUrl: "",
          members: isGroup
            ? [
                { id: "self", name: "You", color: "#8ef0c8", avatarUrl: "" },
                { id: "m1", name: "Ali", color: "#8bc9ff", avatarUrl: "" },
                { id: "m2", name: "Budi", color: "#ffd67d", avatarUrl: "" },
              ]
            : [
                { id: "self", name: "You", color: "#8ef0c8", avatarUrl: "" },
                { id: "other", name: "Alex", color: "#8bc9ff", avatarUrl: "" },
              ],
          messages: [
            { id: uid("msg"), type: "date", text: "Today" },
            {
              id: uid("msg"),
              type: "text",
              direction: "incoming",
              memberId: isGroup ? "m1" : "other",
              text: "Halo 👋",
              time: "10:04",
              status: "sent",
            },
          ],
        };
        clearSelection();
        closeSheets();
        renderAll();
      };

      document.getElementById("openSettingsBtn").onclick = () =>
        openSheet("settings");
      document.getElementById("openMembersBtn").onclick = () =>
        openSheet("members");
      backdrop.onclick = closeSheets;

      directionSelect.onchange = renderComposerSenderOptions;
      senderSelect.onchange = updateComposerModeHint;

      typeSelect.onchange = () => {
        if (typeSelect.value === "voice") {
          composerInput.placeholder = "Voice duration, example 0:08";
        } else if (typeSelect.value === "date") {
          composerInput.placeholder = "Today";
        } else if (typeSelect.value === "system") {
          composerInput.placeholder = "System message";
        } else if (typeSelect.value === "typing") {
          composerInput.placeholder = "Typing indicator";
        } else if (typeSelect.value === "image") {
          composerInput.placeholder = "Image caption";
        } else {
          updateComposerModeHint();
        }
      };

      composerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          addComposerMessage();
        }
      });

      document.getElementById("emojiBtn").onclick = () => {
        composerInput.value += " 😊";
        composerInput.focus();
      };

      document.getElementById("cameraBtn").onclick = () => {
        typeSelect.value = "image";
        composerInput.placeholder = "Image caption";
        composerInput.focus();
      };

      document.getElementById("toolbarEdit").onclick = () => {
        if (state.selectedMessageId) openSheet("message");
      };
      document.getElementById("toolbarDuplicate").onclick = duplicateSelected;
      document.getElementById("toolbarDelete").onclick = deleteSelected;
      document.getElementById("toolbarMove").onclick = () => {
        const a = prompt("Type up / down");
        if (a === "up") moveSelected("up");
        if (a === "down") moveSelected("down");
      };

      msgText.oninput = (e) => {
        const msg = getSelectedMessage();
        if (!msg) return;
        msg.text = e.target.value;
        renderConversation();
      };

      msgTime.oninput = (e) => {
        const msg = getSelectedMessage();
        if (!msg) return;
        msg.time = e.target.value;
        renderConversation();
      };

      msgStatus.onchange = (e) => {
        const msg = getSelectedMessage();
        if (!msg) return;
        msg.status = e.target.value;
        renderConversation();
      };

      dirIncomingBtn.onclick = () => {
        const msg = getSelectedMessage();
        if (!msg) return;
        msg.direction = "incoming";
        msg.memberId =
          state.conversation.type === "group"
            ? state.conversation.members.find((m) => m.id !== "self")?.id ||
              "self"
            : "other";
        renderAll();
        openSheet("message");
      };

      dirOutgoingBtn.onclick = () => {
        const msg = getSelectedMessage();
        if (!msg) return;
        msg.direction = "outgoing";
        msg.memberId = "self";
        renderAll();
        openSheet("message");
      };

      document.getElementById("moveUpBtn").onclick = () => moveSelected("up");
      document.getElementById("moveDownBtn").onclick = () =>
        moveSelected("down");
      document.getElementById("duplicateBtn").onclick = duplicateSelected;
      document.getElementById("deleteBtn").onclick = deleteSelected;

      document.getElementById("privateBtn").onclick = () => {
        state.conversation.type = "private";
        state.conversation.members = [
          { id: "self", name: "You", color: "#8ef0c8", avatarUrl: "" },
          { id: "other", name: "Alex", color: "#8bc9ff", avatarUrl: "" },
        ];
        state.conversation.subtitle = "online";
        state.conversation.messages.forEach((msg) => {
          if (msg.direction === "incoming") msg.memberId = "other";
        });
        renderSettingsSheet();
        renderComposerSenderOptions();
        updateComposerModeHint();
      };

      document.getElementById("groupBtn").onclick = () => {
        state.conversation.type = "group";
        if (!state.conversation.members.find((m) => m.id === "m1")) {
          state.conversation.members = [
            { id: "self", name: "You", color: "#8ef0c8", avatarUrl: "" },
            { id: "m1", name: "Ali", color: "#8bc9ff", avatarUrl: "" },
            { id: "m2", name: "Budi", color: "#ffd67d", avatarUrl: "" },
          ];
        }
        rebuildGroupSubtitle();
        state.conversation.messages.forEach((msg) => {
          if (
            msg.direction === "incoming" &&
            (!msg.memberId || msg.memberId === "other")
          ) {
            msg.memberId = "m1";
          }
        });
        renderSettingsSheet();
        renderComposerSenderOptions();
        updateComposerModeHint();
      };

      document.getElementById("settingsCloseBtn").onclick = closeSheets;
      document.getElementById("settingsSaveBtn").onclick = () => {
        state.conversation.title = chatTitleInput.value || "Untitled Chat";
        state.conversation.subtitle =
          chatSubtitleInput.value ||
          (state.conversation.type === "group" ? "Group chat" : "online");
        renderAll();
        closeSheets();
      };

      document.getElementById("avatarUpload").onchange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        fileToDataUrl(file, (data) => {
          state.conversation.avatarUrl = data;
          renderAll();
          openSheet("settings");
        });
      };

      document.getElementById("bgUpload").onchange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        fileToDataUrl(file, (data) => {
          state.conversation.backgroundUrl = data;
          renderAll();
          openSheet("settings");
        });
      };

      document.getElementById("removeAvatarBtn").onclick = () => {
        state.conversation.avatarUrl = "";
        renderAll();
        openSheet("settings");
      };

      document.getElementById("removeBgBtn").onclick = () => {
        state.conversation.backgroundUrl = "";
        renderAll();
        openSheet("settings");
      };

      document.getElementById("addMemberBtn").onclick = () => {
        const count =
          state.conversation.members.filter((m) => m.id !== "self").length + 1;
        state.conversation.members.push({
          id: uid("m"),
          name: "Member " + count,
          color: ["#8bc9ff", "#ffd67d", "#f6b6ff", "#8ef0c8"][count % 4],
          avatarUrl: "",
        });
        rebuildGroupSubtitle();
        renderAll();
        openSheet("members");
      };

      document.getElementById("membersCloseBtn").onclick = closeSheets;

      document.getElementById("exportBtn").onclick = async () => {
        clearSelection();
        closeSheets();

        const composerBar = document.getElementById("composerBar");
        composerBar.style.display = "none";

        await new Promise((r) => setTimeout(r, 120));

        try {
          const canvas = await html2canvas(
            document.getElementById("captureArea"),
            {
              backgroundColor: "#08101a",
              scale: Math.max(2, window.devicePixelRatio || 2),
              useCORS: true,
              allowTaint: true,
              logging: false,
              imageTimeout: 0,
            },
          );

          const dataUrl = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.download =
            (state.conversation.title || "chat")
              .toLowerCase()
              .replace(/\s+/g, "-") + ".png";
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          alert(
            "Export gagal. Coba lagi setelah wallpaper / avatar selesai dimuat.",
          );
          console.error(err);
        } finally {
          composerBar.style.display = "";
        }
      };

      document.addEventListener("click", (e) => {
        const insideBubble = e.target.closest(
          ".bubble, .date-pill, .system-card",
        );
        const insideToolbar = e.target.closest("#inlineToolbar");
        const insideSheet = e.target.closest(".sheet");
        const insideHeader = e.target.closest(".header");
        const insideComposer = e.target.closest("#composerBar");

        if (
          !insideBubble &&
          !insideToolbar &&
          !insideSheet &&
          !insideHeader &&
          !insideComposer
        ) {
          clearSelection();
        }
      });

      document.getElementById("plusBtn").onclick = () => {
        cycleComposerSender();
      };

      document.getElementById("voiceBtn").onclick = () => {
        if ((composerInput.value || "").trim()) {
          addComposerMessage();
        } else {
          typeSelect.value = "voice";
          composerInput.value = "0:08";
          addComposerMessage();
        }
      };

      composerInput.addEventListener("input", () => {
        composerInput.style.height = "auto";
        composerInput.style.height =
          Math.min(composerInput.scrollHeight, 110) + "px";
      });

      document.getElementById("cameraBtn").onclick = () => {
        typeSelect.value = "image";
        composerInput.placeholder = "Image caption";
        composerInput.focus();
      };

      renderComposerSenderOptions();
      updateComposerModeHint();
      renderAll();
    </script>
  </body>
</html>
